# modem-pro 统一包的 Rust 后端（守护进程 modemd）。
#
# 目标平台：OpenWrt 25.x（musl）。宿主平台（Windows/Linux）也能 `cargo build` 做开发自测。
# 依赖刻意保持精简（见 docs/INTEGRATION.md「后端迁移策略」）：
#   · tiny_http     —— 同步、轻量的 HTTP/1.1 服务器（不引入 tokio/axum 这层异步栈）
#   · serialport    —— AT 串口（关掉 default features，避免 Linux 侧拖进 libudev）
#   · toml          —— 读取 /etc/modemd/config.toml
#   · serde/json    —— /api/* 的 JSON 响应契约
#   · log           —— 日志门面（简单落盘实现见 src/logging.rs）
#   · ctrlc         —— SIGTERM/SIGINT：退出前收干净主机侧拨号器
#   · sha1/base64   —— WebSocket 握手（同端口推送 /ws、/display/ws）
#
# ⚠️ 版本号不在本文件里维护：发布版本以仓库根目录 VERSION 为唯一来源，
#    打包时由顶层 Makefile 以环境变量 MODEMD_VERSION 注入（见 src/version.rs）。

[package]
name = "modemd"
version = "1.0.0"
edition = "2021"
rust-version = "1.77"
description = "modem-pro unified 5G multi-modem manager (Rust backend)"
license = "MIT"
authors = ["LianXia233"]
publish = false

[[bin]]
name = "modemd"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "unwind"
strip = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tiny_http = "0.12"
serialport = { version = "4", default-features = false }
log = { version = "0.4", features = ["std", "alloc"] }
ctrlc = "3"
sha1 = "0.10"
base64 = "0.22"
