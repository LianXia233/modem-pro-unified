# 云编译 modem-pro（OpenWrt 官方 SDK）
#
# 产物两档，同一架构（armsr/armv8 → 包架构 aarch64_generic，Cortex-A53 及以上通用）：
#   · 主线 APK   —— OpenWrt snapshots（25.x，apk 包管理器）
#   · 24.10 IPK  —— OpenWrt 最新 24.10.x（opkg 包管理器）
#
# 触发：
#   · 推送 v* 标签 → 编译 + 自动创建/更新同名 Release 并上传产物
#   · 手动 workflow_dispatch → 只编译（产物存 artifact）
#
# 流程细分：每个阶段一个 step（依赖 → Rust 工具链 → stub → SDK → 缓存 → feeds → 配置 → 编译 → 收集），
# 编译用 V=s 输出细粒度日志，失败可直接定位到具体命令。
#
# 维护提示：
#   · Rust 后端**不再**走 feeds/packages 的 rust/host —— 那条路是 OpenWrt 从源码编译
#     rustc + LLVM，冷启动 1~2 小时。这里改用宿主 rustup 工具链 + 官方
#     aarch64-unknown-linux-musl target，链接交给工具链自带的 rust-lld 自包含链接
#     （MODEM_PRO_HOST_RUST=1，见顶层 Makefile），产出静态 musl 二进制：
#     无运行时 libc 依赖，任意同架构固件可装；feeds 里也不再需要 lang/rust。
#   · 版本号仍是单一来源 VERSION，由 Makefile 以 MODEMD_VERSION 传给 cargo。
#   · cargo 依赖与编译产物走缓存（见「缓存 cargo」步骤），二次起只需几分钟。
#   · modem-pro 的 DEPENDS 只有 +luci-base / +odhcp6c，且都是**运行时**依赖（真机固件自带）。
#     但 OpenWrt 执行 `make package/modem-pro/compile` 时会把它们也当依赖先去编：从 luci feed
#     装真实 luci-base 会连带编 csstidy / lucihttp / ucode-mod-html / rpcd-mod-luci，而这些要
#     base feed 的头文件（lua.h / ucode/module.h / netlink/msg.h）——SDK 里没有 base feed，
#     于是上一轮 CI 就在这一步报缺头文件失败。
#   · 故 feeds **只拉 modem_pro / ci_stub 两个本地 feed，不拉 packages / luci**；luci-base 与
#     odhcp6c 都用「只声明包名、不编任何东西」的 stub 提供，stub 不发布（见 ci_stub 步骤），
#     modem-pro 的 control 里仍照常声明 Depends: luci-base, odhcp6c。

name: 云编译 modem-pro（OpenWrt SDK）

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  # 通用 ARM64：包架构 aarch64_generic（A53/A55/A72 等 64 位设备通用，
  # 无内核模块依赖，任何 aarch64 固件可装）
  TARGET: armsr/armv8
  PKG: modem-pro
  # 宿主 Rust 工具链（需与 rust/Cargo.toml 的 rust-version 兼容；升级时只改这里）
  RUST_TOOLCHAIN: "1.92.0"
  # 宿主直编开关放到 job 级 env：OpenWrt 的**包元数据扫描发生在 feeds 步骤**（子 make 在
  # 每个包目录下 `make -r DUMP=1`），必须让它也看到本开关，否则扫描会把 rust/host 记为
  # modem-pro 的 Build-Depends，写进 tmp/.packageinfo 后被后续 make 复用，怎么设都白搭。
  MODEM_PRO_HOST_RUST: "1"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: apk-mainline
            name: 主线 APK（snapshots · aarch64）
            kind: apk
          - id: ipk-24.10
            name: 24.10 IPK（opkg · aarch64）
            kind: ipk
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 版本号（单一来源 VERSION）
        id: ver
        run: |
          V=$(cat VERSION)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "modem-pro 版本：$V"

      - name: 安装构建依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc gettext git \
            libncurses-dev libssl-dev rsync unzip zlib1g-dev file wget curl \
            zstd xz-utils \
            python3 python3-setuptools swig patch pkg-config \
            ca-certificates tar perl bash

      - name: 安装宿主 Rust 工具链（rustup + musl target）
        run: |
          # 只用于交叉编译 modemd：宿主 rustc + 官方 aarch64-unknown-linux-musl
          # target（minimal profile 已含交叉链接用的 rust-lld）。
          command -v rustup >/dev/null || { echo "runner 未预装 rustup，无法继续"; exit 1; }
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal \
            --no-self-update --target aarch64-unknown-linux-musl
          rustup default "$RUST_TOOLCHAIN"
          rustc -vV
          rustup target list --installed

      - name: 生成构建用 stub（luci-base + odhcp6c，满足构建依赖，不发布）
        run: |
          # 这两个包只是 modem-pro 的**运行时**依赖（真机固件自带），云编译只需要它们
          # 在包元数据里存在、从而被 defconfig 认下来，不需要真的编译。SDK 里没有 base
          # feed 源码，真要编就得先有 lua/ucode/libnl-tiny 的头文件——编不出来，故用
          # 「只声明包名、不编任何东西」的 stub 满足。stub 不发布：收集产物一步只拷
          # modem-pro-*.apk / modem-pro_*.ipk，modem-pro 的 control 里仍照常声明
          # Depends: luci-base, odhcp6c。
          # 注意：stub 的 Makefile 必须 include $(INCLUDE_DIR)/package.mk，否则
          # `make -r DUMP=1` 没有 dumpinfo 目标、feeds 索引里查不到包名（扫描静默失败，
          # 只留 "WARNING: No feed for package 'xxx' found"，依赖照样悬空）。
          mkdir -p "$GITHUB_WORKSPACE/.ci-stub/luci-base-stub" \
                   "$GITHUB_WORKSPACE/.ci-stub/odhcp6c-stub"
          cat > "$GITHUB_WORKSPACE/.ci-stub/luci-base-stub/Makefile" <<'EOF'
          include $(TOPDIR)/rules.mk
          PKG_NAME:=luci-base
          PKG_VERSION:=1.0.0
          PKG_RELEASE:=1
          PKG_MAINTAINER:=CI
          PKG_LICENSE:=Apache-2.0
          include $(INCLUDE_DIR)/package.mk
          define Package/luci-base
            SECTION:=luci
            CATEGORY:=LuCI
            SUBMENU:=3. Applications
            TITLE:=LuCI base (build stub, provided by firmware)
          endef
          define Build/Compile
          endef
          define Package/luci-base/install
          endef
          $(eval $(call BuildPackage,luci-base))
          EOF
          cat > "$GITHUB_WORKSPACE/.ci-stub/odhcp6c-stub/Makefile" <<'EOF'
          include $(TOPDIR)/rules.mk
          PKG_NAME:=odhcp6c
          PKG_VERSION:=1.0.0
          PKG_RELEASE:=1
          PKG_MAINTAINER:=CI
          PKG_LICENSE:=GPL-2.0-only
          include $(INCLUDE_DIR)/package.mk
          define Package/odhcp6c
            SECTION:=net
            CATEGORY:=Network
            TITLE:=odhcp6c (build stub, provided by firmware)
          endef
          define Build/Compile
          endef
          define Package/odhcp6c/install
          endef
          $(eval $(call BuildPackage,odhcp6c))
          EOF
          echo "stub 已生成：.ci-stub/{luci-base,odhcp6c}-stub"

      - name: 下载官方 SDK
        id: sdk
        run: |
          if [ "${{ matrix.kind }}" = apk ]; then
            BASE="https://downloads.openwrt.org/snapshots/targets/${TARGET}"
          else
            REL=$(curl -fsSL https://downloads.openwrt.org/releases/ \
              | grep -oE '24\.10\.[0-9]+' | sort -uV | tail -1)
            [ -n "$REL" ] || { echo "解析不到 24.10.x 版本号"; exit 1; }
            echo "选用 24.10.x：$REL"
            BASE="https://downloads.openwrt.org/releases/$REL/targets/${TARGET}"
          fi
          SDK=$(curl -fsSL "$BASE/" \
            | grep -oE 'openwrt-sdk-[^"<> ]+\.tar\.(xz|zst)' | sort -u | head -1)
          [ -n "$SDK" ] || { echo "在 $BASE 找不到 SDK 压缩包"; exit 1; }
          echo "SDK：$SDK"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          mkdir -p sdk
          # 主线与 24.10.8+ 的 SDK 都是 zstd 压缩（早期是 xz，按后缀兼容）
          case "$SDK" in
            *.tar.zst) curl -fsSL "$BASE/$SDK" | tar --zstd -x --strip-components=1 -C sdk ;;
            *)         curl -fsSL "$BASE/$SDK" | tar -xJ    --strip-components=1 -C sdk ;;
          esac

      - name: 写入选包与构建开关（务必在 feeds 扫描之前）
        working-directory: sdk
        run: |
          # 关键顺序：OpenWrt 的**包元数据扫描在 feeds update/install 期间就会跑**
          # （scan.mk 在每个包目录下 `make -r DUMP=1`），它读 .config 决定各包的
          # Build-Depends，结果写进 tmp/.packageinfo，后续 make 直接复用——而且
          # 之后改 .config 并不会触发重扫。所以 CONFIG_MODEM_PRO_HOST_RUST 必须在
          # feeds 扫描【之前】就落进 .config，否则扫描仍按 HAVE_RUST=1 记下
          # `Build-Depends: rust/host`，之后无论怎样设开关都照样去源码编 rustc + LLVM。
          cat >> .config <<'EOF'
          CONFIG_PACKAGE_modem-pro=y
          CONFIG_MODEM_PRO_HOST_RUST=y
          CONFIG_MODEM_PRO_QUECTEL=y
          CONFIG_MODEM_PRO_FIBOCOM=y
          CONFIG_MODEM_PRO_MEIG=y
          CONFIG_MODEM_PRO_SIMCOM=y
          EOF
          grep -E "^CONFIG_PACKAGE_modem-pro=|^CONFIG_MODEM_PRO_HOST_RUST=" .config

      - name: 缓存 cargo 依赖与编译产物
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .cargo-target
          # Cargo.lock / Makefile / 本文件变化时自然失效重建；命中旧键也有 restore-keys 兜底
          key: cargo-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'Makefile', '.github/workflows/build.yml') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: 更新并安装 feeds
        working-directory: sdk
        run: |
          # feed 名只允许 [A-Za-z0-9_]（scripts/feeds 解析用 (\w+)，不含连字符），
          # 故用 modem_pro / ci_stub，包名 modem-pro / odhcp6c 保持不变。
          # 用最小 feed 包装目录只暴露 modem-pro 包本身，避免 src-link 直接指向仓库根时
          # 扫到 sdk/（OpenWrt SDK 自带数百个包 Makefile）、.git/、docs/ 造成元数据污染/同名冲突。
          # 关键根因：OpenWrt 要求包 Makefile 必须位于 feed 的【子目录】下（feed_dir/<pkg>/Makefile），
          # 不能放在 feed 根。否则 scripts/feeds 扫描（scan.mk 的 `find | grep | sed` 截断逻辑）
          # 会把 `call BuildPackage` 的 grep 输出（含 `Makefile:$(eval ...)`）误当成包路径，
          # 导致 .files-packageinfo.mk 报 "target pattern contains no '%'"，install 也找不到包
          # （WARNING: No feed for package 'modem-pro' found）。
          # 故把包整体复制到 $FEED_DIR/modem-pro/ 子目录（Makefile 随之进入子目录，相对引用不变）。
          # 真实复制（禁止 symlink）：symlink 同样会触发上述扫描 bug。
          FEED_DIR="$GITHUB_WORKSPACE/.ci-feed/modem-pro"
          PKG_DIR="$FEED_DIR/modem-pro"
          rm -rf "$GITHUB_WORKSPACE/.ci-feed"
          mkdir -p "$PKG_DIR"
          for item in Makefile rust third_party luci files packaging VERSION; do
            [ -e "$GITHUB_WORKSPACE/$item" ] && cp -r "$GITHUB_WORKSPACE/$item" "$PKG_DIR/$item"
          done
          # 清掉可能混入的 Rust/内核模块构建产物 target/（体积爆炸 + 平台残留会污染 feed 索引）
          find "$PKG_DIR" -name target -type d -prune -exec rm -rf {} + 2>/dev/null
          echo "src-link modem_pro $FEED_DIR" >> feeds.conf.default
          echo "src-link ci_stub $GITHUB_WORKSPACE/.ci-stub" >> feeds.conf.default
          # 注意：Rust 走宿主工具链直编（见 build 顶部说明），已不再安装 feeds 的 lang/rust；
          # 也**不拉 packages / luci feed**——SDK 里没有 base feed，编不了整棵 LuCI/base，
          # 而 luci-base / odhcp6c 只需在 ci_stub 里声明包名（见上方 stub 步骤）。
          # feeds update 只处理命令行列出的 feed，src-link 也必须列出（否则不会生成
          # feeds/<name>.index，后续 install 会报 "Ignoring feed 'xxx' - index missing"）。
          ./scripts/feeds update modem_pro ci_stub
          # 精确安装所需包（不 install -a）。luci-base 走 ci_stub 的 stub，而非 luci feed 的真包，
          # 这样 `make package/modem-pro/compile` 才不会再连带去编 lucihttp / ucode-mod-html 等。
          ./scripts/feeds install -p ci_stub luci-base
          ./scripts/feeds install -p ci_stub odhcp6c
          ./scripts/feeds install -p modem_pro modem-pro

      - name: 生成配置（defconfig 归一化 + 核对）
        working-directory: sdk
        run: |
          # 选包与开关已在「写入选包与构建开关」步骤（feeds 扫描前）写入 .config；
          # feeds 装完包后这里再 defconfig：把这些符号归一化并补齐依赖。
          make defconfig
          echo "── 配置核对 ──"
          grep -E "^CONFIG_PACKAGE_modem-pro=|^CONFIG_MODEM_PRO_" .config
          grep -qE "^CONFIG_PACKAGE_modem-pro=(y|m)" .config || { echo "defconfig 后 modem-pro 未被选中，依赖可能未满足"; exit 1; }

      - name: 编译 modem-pro（V=s 细粒度日志）
        working-directory: sdk
        run: |
          set -o pipefail
          # MODEM_PRO_HOST_RUST=1      —— 已提到 job 级 env（见文件顶部 env 段）：这样
          #                               feeds 扫描阶段也带该开关，扫描才不会把 rust/host
          #                               记进包元数据；
          # MODEM_PRO_CARGO_TARGET_DIR —— 固定到工作区，给上面的 cargo 缓存复用编译产物。
          MODEM_PRO_CARGO_TARGET_DIR="$GITHUB_WORKSPACE/.cargo-target" \
          make package/modem-pro/compile V=s -j"$(nproc)" 2>&1 | tee build.log

      - name: 收集产物 + 校验和
        working-directory: sdk
        run: |
          mkdir -p output
          find bin/packages -type f \( -name "${PKG}-*.apk" -o -name "${PKG}_*.ipk" \) \
            -exec cp -v {} output/ \;
          ls -lh output/
          if [ -z "$(ls -A output 2>/dev/null)" ]; then
            echo "没有产物：bin/packages 里找不到 modem-pro 包"
            exit 1
          fi
          (cd output && sha256sum * > SHA256SUMS.txt)

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.id }}
          path: sdk/output/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: 发布 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 汇总全部产物
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: 发布 Release
        uses: softprops/action-gh-release@v3
        with:
          name: modem-pro ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: dist/*
          body: |
            modem-pro ${{ github.ref_name }}（OpenWrt 官方 SDK 云编译）

            ## 产物说明

            | 文件 | 适用于 |
            | --- | --- |
            | `modem-pro-*.apk` | OpenWrt 主线 / snapshots（25.x，apk 包管理器） |
            | `modem-pro_*.ipk` | OpenWrt 24.10.x（opkg 包管理器） |

            两者均为 **aarch64_generic**（Cortex-A53 及以上 64 位通用，无内核模块依赖），
            内含 modemd 守护进程、四家厂商拨号器、netifd 协议脚本与 LuCI 前端（菜单已汉化）。

            ## 安装

            ```sh
            # OpenWrt 25.x（apk）
            apk add --allow-untrusted /tmp/modem-pro-*.apk

            # OpenWrt 24.10（opkg）
            opkg install /tmp/modem-pro_*.ipk
            ```

            完整安装验证清单见仓库 [docs/BUILD.md](../../blob/main/docs/BUILD.md)。
